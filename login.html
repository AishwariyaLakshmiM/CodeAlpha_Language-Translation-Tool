<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeoBank Login</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: #fff;
}

.login-box {
    background: #ffffff;
    color: #000;
    padding: 30px;
    width: 350px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.login-box h2 {
    text-align: center;
    margin-bottom: 10px;
}

.login-box p {
    text-align: center;
    font-size: 14px;
    color: #555;
}

.form-group {
    margin-top: 15px;
}

.form-group label {
    font-size: 14px;
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.login-btn {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.login-btn:hover {
    background: #1d4ed8;
}

.bottom-text {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>🔐 NeoBank Login</h2>
    <p>Access your digital banking account</p>

    <!-- ✅ Updated form -->
    <form onsubmit="loginUser(event)">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="bottom-text">
        New user? <a href="signup.html">Create Account</a>
    </div>
</div>

<!-- ✅ Login Logic -->
<script>
function loginUser(event) {
    event.preventDefault();

    const enteredUsername = document.getElementById("loginUsername").value;
    const enteredPassword = document.getElementById("loginPassword").value;

    const userData = JSON.parse(localStorage.getItem("userData"));

    if (!userData) {
        alert("No account found. Please sign up first.");
        return;
    }

    if (enteredUsername === userData.username) {
        // mark user as logged in
        localStorage.setItem("isLoggedIn", "true");

        // redirect to home page
        window.location.href = "index.html";
    } else {
        alert("Invalid login details");
    }
}
</script>

</body>
</html>
